name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH password
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd "${{ secrets.APP_DIR }}"

            git fetch origin master
            git reset --hard origin/master

            npm ci
            npm run build

            cp -r public .next/standalone
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/static

            # Pastikan dependency sharp dan env tersalin ke standalone
            if [ -d node_modules/sharp ]; then
              cp -r node_modules/sharp .next/standalone/node_modules/ 2>/dev/null || true
            fi
            if [ -d node_modules/@img ]; then
              cp -r node_modules/@img .next/standalone/node_modules/ 2>/dev/null || true
            fi
            if [ -f .env ]; then
              cp .env .next/standalone/.env 2>/dev/null || true
            fi

            TARGET_BASE="$(dirname "$PWD")/.next"
            PERSISTENT_UPLOADS="$(dirname "$PWD")/uploads"

            mkdir -p "$TARGET_BASE"
            mkdir -p "$PERSISTENT_UPLOADS"

            # Bersihkan recursive symlink loop 'uploads' di dalam PERSISTENT_UPLOADS (mencegah error ELOOP)
            rm -rf "$PERSISTENT_UPLOADS/uploads" 2>/dev/null || true
            find "$PERSISTENT_UPLOADS" -maxdepth 2 -type l -delete 2>/dev/null || true

            # Salin aset uploads baru dari repositori jika ada
            if [ -d public/uploads ]; then
              cp -rn public/uploads/. "$PERSISTENT_UPLOADS/" 2>/dev/null || true
            fi

            rm -rf "$TARGET_BASE/standalone"
            mv .next/standalone "$TARGET_BASE/standalone"

            mkdir -p "$TARGET_BASE/standalone/public"
            # Hapus folder uploads salinan build Next.js dan buat symlink ke folder uploads permanen
            rm -rf "$TARGET_BASE/standalone/public/uploads"
            ln -sfn "$PERSISTENT_UPLOADS" "$TARGET_BASE/standalone/public/uploads"

            echo "=== DIAGNOSTIK PROSES SEBELUM STOP ==="
            whoami
            ps -ef | grep -E "node|server\.js|pm2" | grep -v grep || true
            ss -tulpn 2>/dev/null | grep 3000 || true
            echo "======================================"

            # Coba hentikan pm2 jika digunakan
            if command -v pm2 >/dev/null 2>&1; then
              pm2 stop all 2>/dev/null || true
              pm2 delete all 2>/dev/null || true
            fi

            # Hentikan semua proses node
            pkill -9 -f "node" 2>/dev/null || true
            sleep 3

            echo "=== DIAGNOSTIK PROSES SETELAH STOP ==="
            ss -tulpn 2>/dev/null | grep 3000 || true
            echo "======================================"

            # Bersihkan log server lama agar log yang tercetak selalu akurat
            rm -f "$TARGET_BASE/server.log"

            cd "$TARGET_BASE/standalone"
            nohup env PORT=3000 HOSTNAME=0.0.0.0 UPLOAD_DIR="$PERSISTENT_UPLOADS" node server.js > ../server.log 2>&1 < /dev/null &
            disown -a 2>/dev/null || true

            sleep 5
            echo "=== SERVER LOG (TERBARU) ==="
            cat ../server.log || true
            echo "============================"

            if ss -tulpn 2>/dev/null | grep -q ":3000 "; then
              echo "Server berhasil aktif dan mendengarkan pada port 3000."
            else
              echo "PERINGATAN: Port 3000 belum aktif. Periksa server.log di atas."
            fi

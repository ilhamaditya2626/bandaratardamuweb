name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH password
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd "${{ secrets.APP_DIR }}"

            git fetch origin master
            git reset --hard origin/master

            npm ci
            npm run build

            cp -r public .next/standalone
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/static

            TARGET_BASE="$(dirname "$PWD")/.next"
            PERSISTENT_UPLOADS="$(dirname "$PWD")/uploads"

            mkdir -p "$TARGET_BASE"
            mkdir -p "$PERSISTENT_UPLOADS"

            # Selamatkan unggahan yang masih ada sebelum build runtime lama diganti.
            if [ -d "$TARGET_BASE/standalone/public/uploads" ]; then
              cp -a "$TARGET_BASE/standalone/public/uploads/." "$PERSISTENT_UPLOADS/"
            fi
            rm -rf "$TARGET_BASE/standalone"
            mv .next/standalone "$TARGET_BASE/standalone"

            PID=$(ss -tulpn | awk '/:3000 / {print $NF}' | sed -n 's/.*pid=\([0-9]*\).*/\1/p' | head -n 1)

            if [ -n "$PID" ]; then
              kill "$PID"
              sleep 5
            fi

            cd "$TARGET_BASE/standalone"
            nohup env UPLOAD_DIR="$PERSISTENT_UPLOADS" node server.js > ../server.log 2>&1 &

name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH password
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd "${{ secrets.APP_DIR }}"

            git fetch origin master
            git reset --hard origin/master

            npm ci
            npm run build

            cp -r public .next/standalone
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/static

            # Pastikan dependency sharp dan env tersalin ke standalone
            if [ -d node_modules/sharp ]; then
              cp -r node_modules/sharp .next/standalone/node_modules/ 2>/dev/null || true
            fi
            if [ -d node_modules/@img ]; then
              cp -r node_modules/@img .next/standalone/node_modules/ 2>/dev/null || true
            fi
            if [ -f .env ]; then
              cp .env .next/standalone/.env 2>/dev/null || true
            fi

            TARGET_BASE="$(dirname "$PWD")/.next"
            PERSISTENT_UPLOADS="$(dirname "$PWD")/uploads"

            mkdir -p "$TARGET_BASE"
            mkdir -p "$PERSISTENT_UPLOADS"

            # Selamatkan unggahan yang masih ada sebelum build runtime lama diganti (hanya jika bukan symlink)
            if [ -d "$TARGET_BASE/standalone/public/uploads" ] && [ ! -L "$TARGET_BASE/standalone/public/uploads" ]; then
              cp -a "$TARGET_BASE/standalone/public/uploads/." "$PERSISTENT_UPLOADS/" 2>/dev/null || true
            fi

            # Salin aset uploads baru dari repositori jika ada
            if [ -d public/uploads ]; then
              cp -rn public/uploads/. "$PERSISTENT_UPLOADS/" 2>/dev/null || true
            fi

            rm -rf "$TARGET_BASE/standalone"
            mv .next/standalone "$TARGET_BASE/standalone"

            mkdir -p "$TARGET_BASE/standalone/public"
            # `public` ikut tersalin saat build. Hapus salinan uploads ini terlebih
            # dahulu; tanpa langkah ini `ln` membuat tautan di dalam folder lama,
            # sehingga URL /uploads membaca berkas build lama dan mengembalikan 404.
            rm -rf "$TARGET_BASE/standalone/public/uploads"
            ln -sfn "$PERSISTENT_UPLOADS" "$TARGET_BASE/standalone/public/uploads"

            # Hentikan proses lama yang berjalan di port 3000
            PID=$(ss -tulpn 2>/dev/null | awk '/:3000 / {print $NF}' | sed -n 's/.*pid=\([0-9]*\).*/\1/p' | head -n 1)
            if [ -n "$PID" ]; then
              kill -9 "$PID" 2>/dev/null || true
            fi
            fuser -k 3000/tcp 2>/dev/null || true
            pkill -9 -f "node.*server.js" 2>/dev/null || true
            sleep 3

            cd "$TARGET_BASE/standalone"
            nohup env PORT=3000 HOSTNAME=0.0.0.0 UPLOAD_DIR="$PERSISTENT_UPLOADS" node server.js > ../server.log 2>&1 < /dev/null &
            disown || true

            sleep 4
            echo "=== SERVER LOG (50 BARIS TERAKHIR) ==="
            tail -n 50 ../server.log || true
            echo "======================================"

            if ss -tulpn 2>/dev/null | grep -q ":3000 "; then
              echo "Server berhasil aktif di port 3000."
            else
              echo "PERINGATAN: Port 3000 belum terdeteksi mendengarkan."
            fi
